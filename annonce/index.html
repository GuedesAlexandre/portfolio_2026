<!doctype html>
<html lang="fr" data-resolution="square">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <!-- Les vraies scènes canvas du site (src/scenes), compilées par vite.scenes.config.mjs -->
    <script src="assets/js/scenes.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1080px; overflow: hidden; background: #000; }
      #stage { position: absolute; inset: 0; background: #000; }
    </style>
  </head>
  <body>
    <!-- Film façon keynote : noir, une idée par plan, coupes calées sur la mesure (122 BPM ≈ 1,96 s) -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="34.5" data-width="1080" data-height="1080">
      <div id="stage"></div>

      <div id="open" data-composition-id="open" data-composition-src="compositions/open.html"
        data-start="0" data-duration="5.965" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1080"></div>
      <div id="product" data-composition-id="product" data-composition-src="compositions/product.html"
        data-start="5.965" data-duration="7.87" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1080"></div>
      <div id="kelp" data-composition-id="kelp" data-composition-src="compositions/kelp.html"
        data-start="13.835" data-duration="3.93" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1080"></div>
      <div id="movie" data-composition-id="movie" data-composition-src="compositions/movie.html"
        data-start="17.765" data-duration="3.93" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1080"></div>
      <div id="azathro" data-composition-id="azathro" data-composition-src="compositions/azathro.html"
        data-start="21.695" data-duration="3.94" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1080"></div>
      <div id="deserts" data-composition-id="deserts" data-composition-src="compositions/deserts.html"
        data-start="25.635" data-duration="3.93" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1080"></div>
      <div id="outro" data-composition-id="outro" data-composition-src="compositions/outro.html"
        data-start="29.565" data-duration="4.935" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1080"></div>

      <!-- Musique (piste du trailer, licence Mixkit) -->
      <audio id="bgm" class="clip" src="assets/audio/bgm.mp3" data-start="0" data-duration="34.5"
        data-volume="0.5" data-fade-in="0.2" data-fade-out="1.6" data-track-index="2"></audio>

      <!-- Bruitages Freesound CC0, peu nombreux : pic calé une image après l'action -->
      <audio id="sfx-riser" class="clip" src="assets/audio/sfx/fs-685256.mp3" data-start="3.24" data-duration="3.04" data-volume="0.45" data-track-index="3"></audio>
      <audio id="sfx-reveal" class="clip" src="assets/audio/sfx/fs-402692.mp3" data-start="5.95" data-duration="0.87" data-volume="0.5" data-track-index="4"></audio>
      <audio id="sfx-cut-kelp" class="clip" src="assets/audio/sfx/fs-71852.mp3" data-start="13.42" data-duration="0.95" data-volume="0.25" data-track-index="3"></audio>
      <audio id="sfx-cut-movie" class="clip" src="assets/audio/sfx/fs-427823.mp3" data-start="17.58" data-duration="0.8" data-volume="0.3" data-track-index="3"></audio>
      <audio id="sfx-cut-azathro" class="clip" src="assets/audio/sfx/fs-71852.mp3" data-start="21.28" data-duration="0.95" data-volume="0.25" data-track-index="3"></audio>
      <audio id="sfx-slam" class="clip" src="assets/audio/sfx/fs-812593.mp3" data-start="23.93" data-duration="1.5" data-volume="0.45" data-track-index="4"></audio>
      <audio id="sfx-cut-deserts" class="clip" src="assets/audio/sfx/fs-427823.mp3" data-start="25.45" data-duration="0.8" data-volume="0.3" data-track-index="3"></audio>
      <audio id="sfx-outro" class="clip" src="assets/audio/sfx/fs-402692.mp3" data-start="29.54" data-duration="0.87" data-volume="0.45" data-track-index="3"></audio>
      <audio id="sfx-pen" class="clip" src="assets/audio/sfx/fs-277312.mp3" data-start="29.95" data-duration="1.07" data-volume="1.1" data-track-index="4"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
